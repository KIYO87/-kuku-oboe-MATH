<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きみのがんばり｜九九おぼえMATH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; background: linear-gradient(135deg, #fffbeb 0%, #f0fdf4 100%); touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen text-slate-700 flex flex-col items-center p-4">
  <main class="w-full max-w-2xl flex flex-col gap-5">

    <div class="flex items-center justify-between">
      <a href="index.html" class="text-xs font-bold text-slate-500 bg-white px-3 py-2 rounded-xl shadow">← トップへ</a>
      <h1 class="text-2xl font-black text-amber-500">🏆 きみのがんばり</h1>
      <span class="w-16"></span>
    </div>

    <!-- ランク -->
    <section class="bg-white rounded-3xl p-5 shadow-lg border-2 border-amber-200 text-center">
      <div class="text-xs font-bold text-slate-400">いまのランク</div>
      <div id="rank-icon" class="text-6xl my-1"></div>
      <div id="rank-name" class="text-2xl font-black text-amber-600"></div>
      <div id="rank-sub" class="text-xs font-bold text-slate-500 mt-1"></div>
      <div class="w-full bg-slate-100 rounded-full h-3 mt-3 overflow-hidden">
        <div id="rank-bar" class="bg-amber-400 h-full transition-all" style="width:0%"></div>
      </div>
      <div id="rank-next" class="text-xs text-slate-400 font-bold mt-2"></div>
    </section>

    <!-- シール帳（アプリごと） -->
    <section class="bg-white rounded-3xl p-5 shadow-lg border-2 border-indigo-100">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-black text-indigo-600">📒 シールちょう　九九答え</h2>
        <span id="album-count-kotae" class="text-xs font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full"></span>
      </div>
      <div id="album-kotae" class="grid grid-cols-4 sm:grid-cols-5 gap-2"></div>
    </section>

    <section class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-black text-emerald-600">📒 シールちょう　九九聞いてもらい</h2>
        <span id="album-count-kiite" class="text-xs font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full"></span>
      </div>
      <div id="album-kiite" class="grid grid-cols-4 sm:grid-cols-5 gap-2"></div>
      <p class="text-[11px] text-slate-400 mt-3">チャレンジを おわらせるたびに、その段の シールが 1まい もらえるよ！</p>
    </section>

    <!-- きろく -->
    <section class="bg-white rounded-3xl p-5 shadow-lg border-2 border-indigo-100">
      <h2 class="text-lg font-black text-indigo-600 mb-3">📊 きろく（トップ10）</h2>

      <div class="grid grid-cols-2 gap-2 mb-3" id="app-tabs">
        <button data-app="kotae" class="app-tab py-2.5 rounded-xl font-black text-sm border-2">✏️ 九九答え</button>
        <button data-app="kiite" class="app-tab py-2.5 rounded-xl font-black text-sm border-2">🎤 聞いてもらい</button>
      </div>

      <div id="dan-tabs" class="grid grid-cols-4 sm:grid-cols-7 gap-1.5 mb-4"></div>

      <div id="table-wrap"></div>
    </section>

    <div class="text-center pb-6">
      <button id="reset-btn" class="text-xs font-bold text-slate-400 underline">きろくを ぜんぶ けす</button>
      <p class="text-[11px] text-slate-400 mt-2">※ きろくは、このたんまつ・このブラウザの中に ほぞんされます。</p>
    </div>
  </main>

  <script src="records.js"></script>
  <script>
    var R = KukuRecords;
    var curApp = 'kotae';
    var curDan = '1';
    var LEVEL_NAME = { 1: 'レベル1', 2: 'レベル2', 3: 'レベル3' };

    function renderRank() {
      var all = R.load(), n = all.length, idx = R.rankIndex(n);
      var r = R.RANKS[idx], next = R.RANKS[idx + 1];
      document.getElementById('rank-icon').textContent = r.icon;
      document.getElementById('rank-name').textContent = r.name;
      var nk = all.filter(function (r) { return r.app === 'kotae'; }).length;
      document.getElementById('rank-sub').textContent = 'シール ' + n + 'まい（九九答え ' + nk + ' ＋ 聞いてもらい ' + (n - nk) + '）';
      if (next) {
        var pct = Math.round(((n - r.min) / (next.min - r.min)) * 100);
        document.getElementById('rank-bar').style.width = pct + '%';
        document.getElementById('rank-next').textContent = 'つぎの「' + next.icon + next.name + '」まで あと ' + (next.min - n) + 'まい';
      } else {
        document.getElementById('rank-bar').style.width = '100%';
        document.getElementById('rank-next').textContent = 'いちばん上の ランクだよ！すごい！';
      }
    }

    function renderAlbum() {
      var all = R.load();
      ['kotae', 'kiite'].forEach(function (app) {
        var counts = {}, total = 0;
        all.forEach(function (r) {
          if (r.app !== app) return;
          counts[r.dan] = (counts[r.dan] || 0) + 1; total++;
        });
        var html = '';
        R.DAN_ORDER.forEach(function (d) {
          var c = counts[d] || 0;
          html += '<div class="rounded-2xl border-2 ' + (c ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-slate-50') + ' p-2 text-center relative">' +
            '<div class="text-3xl" style="' + (c ? '' : 'filter:grayscale(1);opacity:.35') + '">' + R.STICKERS[d] + '</div>' +
            '<div class="text-[10px] font-bold text-slate-500 mt-0.5">' + R.DAN_LABEL[d] + '</div>' +
            (c ? '<div class="absolute -top-1.5 -right-1.5 bg-amber-400 text-white text-[10px] font-black rounded-full min-w-[20px] h-5 px-1 flex items-center justify-center shadow">' + c + '</div>' : '') +
            '</div>';
        });
        document.getElementById('album-' + app).innerHTML = html;
        document.getElementById('album-count-' + app).textContent = 'ぜんぶで ' + total + 'まい';
      });
    }

    function renderTabs() {
      document.querySelectorAll('.app-tab').forEach(function (b) {
        var on = b.getAttribute('data-app') === curApp;
        b.className = 'app-tab py-2.5 rounded-xl font-black text-sm border-2 ' +
          (on ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-white text-slate-500');
      });
      var box = document.getElementById('dan-tabs');
      box.innerHTML = '';
      R.DAN_ORDER.forEach(function (d) {
        var b = document.createElement('button');
        var on = d === curDan;
        b.className = 'py-1.5 rounded-lg font-bold text-[11px] border-2 ' +
          (on ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 bg-white text-slate-500');
        b.textContent = R.STICKERS[d] + ' ' + R.DAN_LABEL[d].replace('のだん', '');
        b.onclick = function () { curDan = d; renderTabs(); renderTable(); };
        box.appendChild(b);
      });
    }

    function renderTable() {
      var rows = R.top(curApp, curDan);
      var wrap = document.getElementById('table-wrap');
      var title = '<div class="text-sm font-black text-slate-600 mb-2">' + R.STICKERS[curDan] + ' ' + R.DAN_LABEL[curDan] +
        '<span class="text-xs font-bold text-slate-400 ml-2">' + (curApp === 'kiite' ? '（はやい じゅん）' : '（とくてんが たかい じゅん）') + '</span></div>';
      if (!rows.length) {
        wrap.innerHTML = title + '<div class="text-center text-sm text-slate-400 font-bold py-8 bg-slate-50 rounded-2xl">まだ きろくが ないよ。<br>ちょうせんしてみよう！</div>';
        return;
      }
      var medal = ['🥇', '🥈', '🥉'];
      var h = title + '<div class="overflow-hidden rounded-2xl border border-slate-200"><table class="w-full text-sm">' +
        '<thead class="bg-slate-50 text-[11px] text-slate-400"><tr>' +
        '<th class="py-2 px-2 text-center">じゅんい</th><th class="py-2 px-2 text-center">きろく</th>' +
        '<th class="py-2 px-2 text-center">レベル</th><th class="py-2 px-2 text-center">ひ</th><th class="py-2 px-2 text-center">じこく</th></tr></thead><tbody>';
      rows.forEach(function (r, i) {
        h += '<tr class="' + (i % 2 ? 'bg-slate-50/60' : 'bg-white') + '">' +
          '<td class="py-2 px-2 text-center font-black">' + (medal[i] || (i + 1)) + '</td>' +
          '<td class="py-2 px-2 text-center font-black text-indigo-600">' + R.fmtValue(curApp, r.value) + '</td>' +
          '<td class="py-2 px-2 text-center text-xs text-slate-500">' + (LEVEL_NAME[r.level] || '') + '</td>' +
          '<td class="py-2 px-2 text-center text-xs text-slate-500">' + R.fmtDate(r.ts) + '</td>' +
          '<td class="py-2 px-2 text-center text-xs text-slate-500">' + R.fmtTime(r.ts) + '</td></tr>';
      });
      h += '</tbody></table></div>';
      wrap.innerHTML = h;
    }

    document.querySelectorAll('.app-tab').forEach(function (b) {
      b.onclick = function () { curApp = b.getAttribute('data-app'); renderTabs(); renderTable(); };
    });
    document.getElementById('reset-btn').onclick = function () {
      if (confirm('きろくと シールが ぜんぶ きえるよ。ほんとうに いい？')) {
        R.clear(); renderAll();
      }
    };
    function renderAll() { renderRank(); renderAlbum(); renderTabs(); renderTable(); }
    renderAll();
  </script>
</body>
</html>
